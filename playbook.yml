- name: Setup production server
  hosts: servers
  become: true

  roles:
    - nginx

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
        state: present

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Docker apt signing key from project files
      ansible.builtin.copy:
        src: files/docker.asc
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Install Docker Engine (geerlingguy.docker)
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        # Vendored key in repo; HTTPS to download.docker.com/gpg may time out on the host.
        docker_apt_gpg_key: /etc/apt/keyrings/docker.asc
        docker_users:
          - "{{ ansible_user }}"

    - name: Install Docker SDK for Python (for community.docker modules)
      ansible.builtin.apt:
        name: python3-docker
        state: present

    - name: Enable ufw port 22
      community.general.ufw:
        rule: allow
        port: "22"

    - name: Enable ufw port 80
      community.general.ufw:
        rule: allow
        port: "80"

    - name: Enable ufw port 443
      community.general.ufw:
        rule: allow
        port: "443"

    - name: Enable ufw port 8080
      community.general.ufw:
        rule: allow
        port: "8080"

    - name: Enable ufw port 9090
      community.general.ufw:
        rule: allow
        port: "9090"

    - name: Create postgresql directory
      ansible.builtin.file:
        path: /root/.postgresql
        state: directory
        mode: "0700"

    - name: Download Yandex Cloud certificates
      ansible.builtin.get_url:
        url: https://storage.yandexcloud.net/cloud-certs/CA.pem
        dest: /root/.postgresql/root.crt
        mode: "0600"

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Install Certbot and obtain certificate
      ansible.builtin.include_role:
        name: geerlingguy.certbot
      vars:
        certbot_install_method: package
        certbot_create_if_missing: true
        certbot_create_method: standalone
        certbot_admin_email: kimdeun@yandex.ru
        certbot_certs:
          - domains:
              - hesss.sytes.net

    - name: Copy Nginx HTTPS config
      ansible.builtin.template:
        src: roles/nginx/templates/nginx-https.conf.j2
        dest: /etc/nginx/sites-available/bulletin-board
        mode: "0644"
        owner: root
        group: root
      notify: Restart Nginx
