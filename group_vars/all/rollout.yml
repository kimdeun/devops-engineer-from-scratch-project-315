---
# Параметры выката для play `deploy.yml` (обновление Docker-контейнера приложения).
# Используются директивы Ansible: serial и max_fail_percentage.
#
# serial — сколько хостов из группы `servers` обрабатывать одновременно:
#   число (1), процент ("25%"), несколько шагов ([1, 2, 25%]) или "100%" (все сразу).
# При одном production-сервере выкат по сути атомарный (один контейнер за проход).
#
# max_fail_percentage — допустимая доля упавших хостов в текущей партии (0 = любой сбой останавливает play).
ansible_rollout_serial: "100%"
ansible_rollout_max_fail_percentage: 0
